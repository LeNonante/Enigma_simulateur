services:
  enigma:
    build: .
    image: enigma-web
    container_name: enigma
    expose:
      - '8000'
    environment:
      # Clé qui signe les cookies de session (facultative : si elle est vide,
      # une clé aléatoire est générée à chaque démarrage).
      SECRET_KEY: ${SECRET_KEY:-}
    restart: unless-stopped
    networks:
      - services_net

networks:
  services_net:
    external: true
